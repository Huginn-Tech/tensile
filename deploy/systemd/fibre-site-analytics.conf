# A drop-in for fibre-site@ on a network with the Analytics page, installed as
# /etc/systemd/system/fibre-site@<network>.service.d/analytics.conf. A deploy
# replaces the site's directory and restarts the site; this puts the last data
# file back at once, before the next timer run (fibre-analytics-publish, as
# the job's own copy is made). "-": a site with no file yet starts all the
# same. The copy keeps the time the job wrote it, which healthwatch's
# analytics check reads.
[Service]
ExecStartPost=-+/usr/local/bin/fibre-analytics-publish %i
