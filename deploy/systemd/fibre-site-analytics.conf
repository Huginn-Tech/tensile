# A drop-in for fibre-site@ on a network with the Analytics page, installed as
# /etc/systemd/system/fibre-site@<network>.service.d/analytics.conf. A deploy
# replaces the site's directory and restarts the site; this puts the last data
# file back at once, before the next timer run. "-": a site with no file yet
# starts all the same.
[Service]
ExecStartPost=-+/usr/bin/install -m 0644 /var/lib/fibre-analytics/%i/data.json /srv/fibre-site/%i/analytics/data.json
